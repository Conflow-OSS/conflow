# Local infrastructure for the API + worker.
#   postgres — the database (pgvector image: Postgres + the vector extension)
#   redis    — the BullMQ job queue
#   minio    — S3-compatible object storage for the rendered image cards
#
#   docker compose up -d
services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: content_engine
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, only on a brand-new (empty) volume — creates
      # content_engine_test alongside the content_engine the app itself uses.
      # If you already had a postgres volume from before this existed, either
      # `docker compose down -v` to let it re-run, or create the test db by
      # hand: docker compose exec postgres createdb -U postgres content_engine_test
      - ./packages/server/scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    command: ["postgres"]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    # A named volume (not a bind mount) — MinIO's RenameData fails on the
    # virtualized filesystem Docker Desktop uses for bind mounts on macOS.
    volumes:
      - minio-data:/data
    command: ["server", "/data", "--console-address", ":9001"]

volumes:
  postgres-data:
  redis-data:
  minio-data:
