# Local infrastructure for the API + worker.
#   redis  — the BullMQ job queue (added in M12b)
#   minio  — S3-compatible object storage for the rendered image cards
#
#   docker compose up -d
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    # A named volume (not a bind mount) — MinIO's RenameData fails on the
    # virtualized filesystem Docker Desktop uses for bind mounts on macOS.
    volumes:
      - minio-data:/data
    command: ["server", "/data", "--console-address", ":9001"]

volumes:
  redis-data:
  minio-data:
